<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pesquisa Culturama</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="icon" href="./culturama-favico.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <header>
        <img src="./img/logo-culturama.png" alt="Logo Culturama" />
        <h1>Pesquisa de Opinião</h1>
      </header>
      <section>
        <form action="./sucesso.html" method="get">
          <fieldset>
            <legend>Dados Pessoais</legend>

            <label for="name">Nome</label>
            <input type="text" name="userName" id="name" required /><br />

            <label for="age">Idade</label>
            <input
              type="number"
              name="userAge"
              min="12"
              max="100"
              id="age"
              required
            /><br />

            <label for="birthDate">Data de Nascimento</label>
            <input type="date" name="birthDate" /><br />

            <label for="email">E-mail</label>
            <input type="email" name="userEmail" id="email" required /><br />

            <label for="phoneNumber">Telefone</label>
            <input
              type="tel"
              name="userPhoneNumber"
              pattern="[0-9]{11}"
              title="11987654321"
              placeholder="DDD+número"
              id="phoneNumber"
              aria-describedby="phoneHelp"
            />
            <small id="phoneHelp"
              >Preencha com 11 digitos no formato DDD+número</small
            ><br />

            <label for="userImg">Upload de Foto</label>
            <input
              type="file"
              accept="image/*"
              name="userImg"
              aria-describedby="imgHelp"
            />
            <small id="imgHelp">Envie uma imagem no formato .png ou .jpg</small
            ><br />
          </fieldset>

          <fieldset>
            <legend>Perfil</legend>

            <p>Gênero:</p>
            <input
              type="radio"
              name="userGender"
              value="Masculino"
              id="masculino"
            />
            <label for="masculino">Masculino</label>
            <input
              type="radio"
              name="userGender"
              value="Feminino"
              id="feminino"
            />
            <label for="feminino">Feminino</label>
            <input
              type="radio"
              name="userGender"
              value="notInformed"
              id="noGender"
            />
            <label for="noGender">Prefiro não informar</label><br />

            <label for="maritalStatus">Estado Cívil</label>
            <select name="maritalStatus">
              <option value="notInformed">Selecione...</option>
              <option value="Solteiro">Solteiro</option>
              <option value="Casado">Casado</option>
              <option value="Divorciado">Divorciado</option>
              <option value="UniaoEstavel">União Estavel</option>
            </select>

            <label for="userState">Estado</label>
            <select name="userState" required>
              <option value="AC">Acre</option>
              <option value="AL">Alagoas</option>
              <option value="AP">Amapá</option>
              <option value="AM">Amazonas</option>
              <option value="BA">Bahia</option>
              <option value="CE">Ceará</option>
              <option value="DF">Distrito Federal</option>
              <option value="ES">Espirito Santo</option>
              <option value="GO">Goiás</option>
              <option value="MA">Maranhão</option>
              <option value="MS">Mato Grosso do Sul</option>
              <option value="MT">Mato Grosso</option>
              <option value="MG">Minas Gerais</option>
              <option value="PA">Pará</option>
              <option value="PB">Paraíba</option>
              <option value="PR">Paraná</option>
              <option value="PE">Pernambuco</option>
              <option value="PI">Piauí</option>
              <option value="RJ">Rio de Janeiro</option>
              <option value="RN">Rio Grande do Norte</option>
              <option value="RS">Rio Grande do Sul</option>
              <option value="RO">Rondônia</option>
              <option value="RR">Roraima</option>
              <option value="SC">Santa Catarina</option>
              <option value="SP">São Paulo</option>
              <option value="SE">Sergipe</option>
              <option value="TO">Tocantins</option></select
            ><br />

            <label for="userCity">Cidade</label>
            <input type="text" name="userCity" autocomplete="address-level2" />
          </fieldset>

          <fieldset>
            <legend>Hábitos</legend>

            <p>Redes Sociais:</p>
            <input
              type="checkbox"
              name="userSocial"
              value="instagram"
              id="instagram"
            />
            <label for="instagram">Instagram</label>
            <input
              type="checkbox"
              name="userSocial"
              value="facebook"
              id="facebook"
            />
            <label for="facebook">Facebook</label>
            <input
              type="checkbox"
              name="userSocial"
              value="linkedin"
              id="linkedin"
            />
            <label for="linkedin">Linkedin</label>
            <input
              type="checkbox"
              name="userSocial"
              value="twitter"
              id="twitter"
            />
            <label for="twitter">Twitter</label><br />

            <label for="musicStyle">Estilo Musical</label>
            <input
              type="text"
              name="userMusicStyle"
              id="musicStyle"
              list="musicStyleTypes"
            />
            <datalist id="musicStyleTypes">
              <option value="Rock"></option>
              <option value="Pop"></option>
              <option value="Samba"></option>
              <option value="Metal"></option></datalist
            ><br />

            <label for="favColor">Cor Favorita</label>
            <input type="color" name="userFavColor" id="favColor" />
          </fieldset>

          <fieldset>
            <legend>Opniões</legend>

            <input
              type="radio"
              name="userSatisfactionRate"
              value="Great"
              id="greatRate"
            />
            <label for="greatRate">Ótima</label><br />

            <input
              type="radio"
              name="userSatisfactionRate"
              value="Good"
              id="goodRate"
            />
            <label for="goodRate">Boa</label><br />

            <input
              type="radio"
              name="userSatisfactionRate"
              value="Regular"
              id="regularRate"
            />
            <label for="regularRate">Regular</label><br />

            <input
              type="radio"
              name="userSatisfactionRate"
              value="Bad"
              id="badRate"
            />
            <label for="badRate">Ruim</label><br />

            <label for="comments">Comentários</label>
            <textarea
              name="userComments"
              id="comments"
              placeholder="Sua opinião..."
            ></textarea>
          </fieldset>

          <fieldset>
            <legend>Confirmações</legend>

            <input
              type="checkbox"
              name="userLGPD"
              value="accepted"
              id="userLGPDTerm"
              required
            />
            <label for="userLGPDTerm">Eu Aceito</label><br />

            <input
              type="checkbox"
              name="userGetResult"
              value="accepted"
              id="getResult"
            />
            <label for="getResult">Desejeto Receber Resultado</label><br />
          </fieldset>

          <button type="submit" aria-label="Enviar Formulário">Enviar</button>
          <button type="reset" aria-label="Limpar Formulário">Limpar</button>
        </form>
      </section>
    </main>
  </body>
</html>
